  <g stroke="#4a3323" stroke-width="2" opacity="0.75">
    <path d="M262 130 V680"/>
    <path d="M298 130 V680"/>
    <path d="M262 150 H298"/>
    <path d="M262 180 H298"/>
    <path d="M262 210 H298"/>
    <path d="M262 240 H298"/>
    <path d="M262 270 H298"/>
    <path d="M262 300 H298"/>
    <path d="M262 330 H298"/>
    <path d="M262 360 H298"/>
    <path d="M262 390 H298"/>
    <path d="M262 420 H298"/>
    <path d="M262 450 H298"/>
    <path d="M262 480 H298"/>
    <path d="M262 510 H298"/>
    <path d="M262 540 H298"/>
    <path d="M262 570 H298"/>
    <path d="M262 600 H298"/>
    <path d="M262 630 H298"/>
    <path d="M262 660 H298"/>
  </g>
  <ellipse cx="280" cy="130" rx="16" ry="6" fill="#e8dfcd" stroke="#4a3323" stroke-width="2"/>


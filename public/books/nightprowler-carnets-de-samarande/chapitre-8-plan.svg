    <path d="M820 683 V690"/>
    <circle cx="850" cy="680" r="2"/>
    <path d="M850 682 V688"/>
  </g>

  <!-- Galerie effondrée -->
  <path d="M930 620 H1020" stroke="#4a3323" stroke-width="3" stroke-dasharray="8 5" fill="none"/>
  <path d="M930 670 H1020" stroke="#4a3323" stroke-width="3" stroke-dasharray="8 5" fill="none"/>
  <path d="M930 620 V670" stroke="#4a3323" stroke-width="2" stroke-dasharray="8 5" fill="none"/>
  <g fill="#d6c6a6" stroke="#4a3323" stroke-width="2">
    <path d="M1020 610 L1040 625 L1032 642 L1044 660 L1028 682 L1012 666 L1018 646 L1006 632 Z"/>
  </g>
  <text x="1036" y="705" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="12" fill="#4a3323">éboulement</text>


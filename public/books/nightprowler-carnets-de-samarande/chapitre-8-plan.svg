      <path d="M0 14 H28" stroke="#c9b895" stroke-width="1" opacity="0.55"/>
      <circle cx="7" cy="7" r="1.2" fill="#c9b895" opacity="0.6"/>
      <circle cx="21" cy="21" r="1.2" fill="#c9b895" opacity="0.6"/>
    </pattern>
    <marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4a3323"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#f2ece0"/>
  <rect x="18" y="18" width="1164" height="764" fill="none" stroke="#4a3323" stroke-width="2" rx="10"/>

  <text x="600" y="44" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#241d17">La salle basse, en coupe</text>
  <text x="600" y="70" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-size="14" fill="#4a3323">Coupe schématique, sans échelle. Les lettres renvoient à la clé de la salle.</text>

  <text x="600" y="96" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="13" fill="#4a3323">Niveau de la rue, quartier des Hautes Lices</text>
  <path d="M80 120 H1120" stroke="#4a3323" stroke-width="3" fill="none"/>
  <g stroke="#4a3323" stroke-width="1.5" opacity="0.55">
    <path d="M120 120 L108 108"/>
    <path d="M180 120 L168 108"/>
    <path d="M240 120 L228 108"/>
    <path d="M300 120 L288 108"/>
    <path d="M360 120 L348 108"/>
    <path d="M420 120 L408 108"/>
    <path d="M480 120 L468 108"/>
    <path d="M540 120 L528 108"/>
    <path d="M600 120 L588 108"/>
    <path d="M660 120 L648 108"/>

  <rect x="306" y="640" width="8" height="36" fill="#f7f1e4" stroke="none"/>
  <path d="M310 600 V640" stroke="#4a3323" stroke-width="3" fill="none"/>
  <path d="M310 676 V690" stroke="#4a3323" stroke-width="3" fill="none"/>
  <path d="M310 690 H930" stroke="#4a3323" stroke-width="3" fill="none"/>


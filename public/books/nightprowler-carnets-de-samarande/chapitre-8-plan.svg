<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="titre plan">
  <title id="titre">Coupe de la salle basse d'Azefhfkrijiiir</title>
  <desc id="plan">Coupe schématique sous le quartier des Hautes Lices : puits de chantier A, seuil descellé B, salle basse C, sarcophage D, pierre gravée E, niche des morts F et galerie effondrée G.</desc>

  <defs>

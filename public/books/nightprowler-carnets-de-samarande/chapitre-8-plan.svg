  <g stroke="#4a3323" stroke-width="2" fill="none" opacity="0.75">
    <circle cx="382" cy="680" r="3"/>
    <path d="M382 683 V690"/>
    <circle cx="414" cy="680" r="3"/>
    <path d="M414 683 V690"/>
    <circle cx="446" cy="680" r="3"/>

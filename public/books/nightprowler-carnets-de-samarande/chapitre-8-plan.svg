  <rect x="881" y="608" width="49" height="82" rx="3" fill="#d6c6a6" stroke="#4a3323" stroke-width="3"/>
  <g stroke="#4a3323" stroke-width="1.5" opacity="0.8">
    <path d="M890 620 H921"/>
    <path d="M890 634 H921"/>
    <path d="M890 648 H921"/>
    <path d="M890 662 H921"/>

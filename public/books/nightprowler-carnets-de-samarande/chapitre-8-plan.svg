    <path d="M310 718 H930"/>
    <path d="M770 600 V690"/>
  </g>
  <text x="1090" y="410" font-family="Outfit, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#241d17">30 m</text>
  <text x="620" y="712" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#241d17">9 m</text>
  <text x="770" y="594" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#241d17">1,1 m</text>

  <!-- Lettres -->
  <g font-family="Outfit, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#f2ece0">
    <circle cx="280" cy="165" r="16" fill="#9a6b34"/>
    <text x="280" y="171" text-anchor="middle">A</text>
    <circle cx="358" cy="575" r="15" fill="#9a6b34"/>
    <text x="358" y="581" text-anchor="middle">B</text>
    <path d="M345 585 L320 638" stroke="#9a6b34" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
    <circle cx="500" cy="625" r="15" fill="#9a6b34"/>
    <text x="500" y="631" text-anchor="middle">C</text>
    <circle cx="650" cy="626" r="15" fill="#9a6b34"/>
    <text x="650" y="632" text-anchor="middle">D</text>
    <circle cx="850" cy="640" r="15" fill="#9a6b34"/>
    <text x="850" y="646" text-anchor="middle">E</text>
    <path d="M866 640 H881" stroke="#9a6b34" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
    <circle cx="424" cy="660" r="13" fill="#9a6b34"/>
    <text x="424" y="665" text-anchor="middle" font-size="14">F</text>
    <circle cx="990" cy="600" r="15" fill="#9a6b34"/>
    <text x="990" y="606" text-anchor="middle">G</text>
  </g>

  <!-- Légende -->
  <g font-family="Outfit, Segoe UI, sans-serif" fill="#241d17">
    <rect x="80" y="730" width="1040" height="46" rx="8" fill="#f7f1e4" stroke="#9a6b34" stroke-width="1.5"/>
    <text x="96" y="750" font-size="13" font-weight="700">A. Puits de chantier. B. Seuil descellé. C. Salle basse. D. Sarcophage. E. Pierre gravée.</text>
    <text x="96" y="768" font-size="13">F. Niche des morts. G. Galerie effondrée. Trait pointillé : passage étroit ou condamné.</text>
  </g>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="titre schema">
  <title id="titre">Le verrou, la descente et les issues</title>
  <desc id="schema">Schéma en trois panneaux : le kriss verrouille le crâne, la possession fait descendre la volonté pendant que les caractéristiques montent, et le rituel mène à trois issues, refermer, briser ou laisser faire.</desc>

  <rect x="0" y="0" width="1200" height="800" fill="#f2ece0"/>
  <rect x="18" y="18" width="1164" height="764" fill="none" stroke="#4a3323" stroke-width="2" rx="10"/>

  <text x="600" y="44" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#241d17">Le verrou, la descente, les issues</text>
  <text x="600" y="70" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-size="14" fill="#4a3323">Schéma de la possession et des trois fins possibles. Sans échelle.</text>

  <!-- Panneau 1 -->
  <rect x="40" y="96" width="340" height="650" rx="10" fill="#f7f1e4" stroke="#9a6b34" stroke-width="2"/>
  <text x="60" y="128" font-family="Outfit, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#241d17">1. Le verrou</text>

  <g>
    <path d="M150 250 C150 200 178 178 210 178 C242 178 270 200 270 250 C270 282 256 304 240 314 L240 342 C240 356 226 366 210 366 C194 366 180 356 180 342 L180 314 C164 304 150 282 150 250 Z" fill="#e8dfcd" stroke="#4a3323" stroke-width="2.5"/>
    <ellipse cx="190" cy="250" rx="16" ry="12" fill="#4a3323" opacity="0.85"/>
    <ellipse cx="230" cy="250" rx="16" ry="12" fill="#4a3323" opacity="0.85"/>
    <path d="M210 260 L200 286 H220 Z" fill="#4a3323" opacity="0.7"/>
    <path d="M188 330 Q210 344 232 330" stroke="#4a3323" stroke-width="2" fill="none"/>
    <path d="M196 336 V344" stroke="#4a3323" stroke-width="1.5" fill="none"/>
    <path d="M204 339 V347" stroke="#4a3323" stroke-width="1.5" fill="none"/>
    <path d="M212 340 V348" stroke="#4a3323" stroke-width="1.5" fill="none"/>
    <path d="M220 339 V347" stroke="#4a3323" stroke-width="1.5" fill="none"/>
    <path d="M166 200 C150 180 142 166 150 150" stroke="#4a3323" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M254 200 C270 180 278 166 270 150" stroke="#4a3323" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M232 190 L222 214 L234 226 L226 244" stroke="#9a6b34" stroke-width="3" fill="none"/>
    <path d="M210 220 C200 205 218 192 210 176 L210 150" stroke="#4a3323" stroke-width="4" fill="none"/>
    <path d="M190 150 H230" stroke="#4a3323" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M210 150 V124" stroke="#4a3323" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="210" cy="120" r="6" fill="#9a6b34" stroke="#4a3323" stroke-width="2"/>
    <path d="M202 138 H206" stroke="#9a6b34" stroke-width="2" fill="none"/>
    <path d="M214 138 H218" stroke="#9a6b34" stroke-width="2" fill="none"/>
  </g>

  <g font-family="Merriweather, Georgia, serif" font-size="12" fill="#4a3323">
    <path d="M96 158 L196 158" stroke="#9a6b34" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
    <text x="60" y="162">kriss</text>
    <path d="M158 192 L202 146" stroke="#9a6b34" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
    <text x="52" y="200">runes du manche</text>
    <path d="M104 282 L224 232" stroke="#9a6b34" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
    <text x="60" y="290">fêlure</text>
    <path d="M300 184 L266 192" stroke="#9a6b34" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
    <text x="300" y="188">cornes</text>
    <path d="M164 348 L186 338" stroke="#9a6b34" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
    <text x="60" y="352">mâchoire brisée</text>
  </g>

  <g>
    <rect x="80" y="410" width="80" height="80" rx="4" fill="#e8dfcd" stroke="#4a3323" stroke-width="2.5"/>
    <g stroke="#4a3323" stroke-width="2" opacity="0.8">
      <path d="M92 426 H148"/>
      <path d="M92 440 H148"/>
      <path d="M92 454 H136"/>
      <path d="M92 468 H148"/>
    </g>
    <text x="174" y="438" font-family="Merriweather, Georgia, serif" font-size="12" fill="#4a3323">glyphes</text>
    <path d="M160 444 L170 444" stroke="#9a6b34" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
  </g>

  <g>
    <rect x="240" y="410" width="110" height="70" rx="4" fill="#e8dfcd" stroke="#4a3323" stroke-width="2.5"/>
    <path d="M240 428 H350" stroke="#4a3323" stroke-width="2" fill="none"/>
    <ellipse cx="295" cy="450" rx="30" ry="8" fill="none" stroke="#9a6b34" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="295" y="502" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-size="12" fill="#4a3323">sarcophage</text>
  </g>

  <g font-family="Merriweather, Georgia, serif" font-size="14" fill="#4a3323" text-anchor="middle">
    <text x="210" y="566">Le kriss est le verrou.</text>
    <text x="210" y="588">Les glyphes sont le calmant.</text>
    <text x="210" y="610">Le sarcophage est la porte.</text>
    <text x="210" y="650" font-size="12">Un seul objet cède,</text>
    <text x="210" y="668" font-size="12">et les deux autres ne suffisent plus.</text>
  </g>

  <!-- Panneau 2 -->
  <rect x="410" y="96" width="380" height="650" rx="10" fill="#f7f1e4" stroke="#9a6b34" stroke-width="2"/>
  <text x="430" y="128" font-family="Outfit, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#241d17">2. La descente</text>

  <g font-family="Merriweather, Georgia, serif" font-size="12" fill="#4a3323">
    <path d="M430 154 H470" stroke="#4a3323" stroke-width="3" fill="none"/>
    <text x="478" y="158">volonté</text>
    <path d="M570 154 H610" stroke="#9a6b34" stroke-width="3" stroke-dasharray="8 5" fill="none"/>
    <text x="618" y="158">caractéristiques</text>
  </g>

  <path d="M450 620 H750" stroke="#4a3323" stroke-width="2" fill="none"/>
  <g stroke="#4a3323" stroke-width="2" fill="none">
    <path d="M450 614 V626"/>
    <path d="M510 614 V626"/>
    <path d="M570 614 V626"/>
    <path d="M630 614 V626"/>
    <path d="M690 614 V626"/>
    <path d="M750 614 V626"/>
  </g>
  <g font-family="Outfit, Segoe UI, sans-serif" font-size="12" fill="#4a3323" text-anchor="middle">
    <text x="450" y="644">J1</text>
    <text x="510" y="644">J3</text>
    <text x="570" y="644">J5</text>
    <text x="630" y="644">J7</text>
    <text x="690" y="644">J9</text>
    <text x="750" y="644">J11</text>
  </g>

  <path d="M450 190 C520 230 575 380 630 480 C665 540 710 585 750 596" stroke="#4a3323" stroke-width="3.5" fill="none"/>
  <path d="M450 590 C520 550 575 430 630 340 C665 290 710 230 750 205" stroke="#9a6b34" stroke-width="3" stroke-dasharray="8 5" fill="none"/>
  <circle cx="450" cy="190" r="5" fill="#4a3323"/>
  <circle cx="750" cy="596" r="5" fill="#4a3323"/>
  <circle cx="450" cy="590" r="5" fill="#9a6b34"/>
  <circle cx="750" cy="205" r="5" fill="#9a6b34"/>

  <text x="460" y="180" font-family="Merriweather, Georgia, serif" font-size="12" fill="#4a3323">volonté initiale</text>
  <text x="744" y="614" text-anchor="end" font-family="Merriweather, Georgia, serif" font-size="12" fill="#4a3323">volonté 0</text>

  <g font-family="Merriweather, Georgia, serif" font-size="14" fill="#4a3323" text-anchor="middle">
    <text x="600" y="700">Chaque don accepté coûte un point de volonté de plus.</text>
    <text x="600" y="722" font-size="12">Le rituel doit avoir lieu avant la volonté 0.</text>
  </g>

  <!-- Panneau 3 -->
  <rect x="820" y="96" width="340" height="650" rx="10" fill="#f7f1e4" stroke="#9a6b34" stroke-width="2"/>
  <text x="840" y="128" font-family="Outfit, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#241d17">3. Les issues</text>

  <g>
    <rect x="840" y="160" width="300" height="150" rx="8" fill="#e8dfcd" stroke="#9a6b34" stroke-width="2"/>
    <circle cx="866" cy="192" r="14" fill="#9a6b34"/>
    <text x="866" y="198" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#f2ece0">1</text>
    <text x="892" y="198" font-family="Outfit, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#241d17">Refermer</text>
    <g font-family="Merriweather, Georgia, serif" font-size="13" fill="#4a3323">
      <text x="860" y="230">Le kriss revient dans le crâne.</text>
      <text x="860" y="252">La possession cesse.</text>
      <text x="860" y="274">Une marque reste.</text>
    </g>
  </g>

  <g>
    <rect x="840" y="340" width="300" height="150" rx="8" fill="#e8dfcd" stroke="#9a6b34" stroke-width="2"/>
    <circle cx="866" cy="372" r="14" fill="#9a6b34"/>
    <text x="866" y="378" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#f2ece0">2</text>
    <text x="892" y="378" font-family="Outfit, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#241d17">Briser</text>
    <g font-family="Merriweather, Georgia, serif" font-size="13" fill="#4a3323">
      <text x="860" y="410">Le crâne éclate.</text>
      <text x="860" y="432">L'esprit se disperse.</text>
      <text x="860" y="454">Un éclat chuchote.</text>
    </g>
  </g>

  <g>
    <rect x="840" y="520" width="300" height="150" rx="8" fill="#e8dfcd" stroke="#9a6b34" stroke-width="2"/>
    <circle cx="866" cy="552" r="14" fill="#9a6b34"/>
    <text x="866" y="558" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#f2ece0">3</text>
    <text x="892" y="558" font-family="Outfit, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#241d17">Laisser faire</text>
    <g font-family="Merriweather, Georgia, serif" font-size="13" fill="#4a3323">
      <text x="860" y="590">Le démon sort du puits.</text>
      <text x="860" y="612">Il rassemble les siens.</text>
      <text x="860" y="634">La campagne bascule.</text>
    </g>
  </g>

  <text x="990" y="710" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-size="14" fill="#4a3323">Aucune issue n'est propre.</text>

</svg>
